name: Run Tests

on:
    push:
        branches:
            - omena-main
    pull_request:
        branches:
            - omena-main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up dependencies
              run: |
                  sudo apt update
                  sudo apt install -y build-essential

            - name: Build shared lib
              run: make

            - name: Run tests
              run: |
                  cd test
                  make
